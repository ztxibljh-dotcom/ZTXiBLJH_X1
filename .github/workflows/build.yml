name: Build libbootstrap
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone upstream source
        run: git clone --depth 1 https://github.com/noodle1983/UnityAndroidIl2cppPatchDemo-libboostrap.git src
      - name: Setup NDK r26b
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
      - name: Apply patches
        run: |
          set -x
          cd src
          python3 "$GITHUB_WORKSPACE/apply_patches.py"
          echo "--- patched init_hook ---"
          grep -n "libmain.so" bootstrap.cpp
          grep -n "xhook_refresh" bootstrap.cpp
          grep -n "MY_LOG" log.h
      - name: Build (bootstrap module only)
        run: |
          set -x
          cd src
          "${{ steps.ndk.outputs.ndk-path }}/ndk-build" -j"$(nproc)" \
            NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk APP_ABI=arm64-v8a \
            APP_LDFLAGS="-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384" \
            bootstrap
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbootstrap-arm64
          path: src/libs/arm64-v8a/libbootstrap.so
